name: CI

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    name: Lint et tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Configurer Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      # Le builder @angular/build:unit-test utilise Vitest en jsdom :
      # pas de navigateur à installer sur le runner.
      - name: Tests
        run: npm test -- --watch=false

      # Build en configuration production : c'est celle qui part en
      # prod (environment.ts, budgets de taille de bundle).
      - name: Build production
        run: npm run build

  docker:
    name: Build de l'image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # Le cache GHA exige le driver docker-container : le driver docker
      # par défaut ne sait pas exporter de cache.
      - name: Configurer Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build de l'image (sans push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
